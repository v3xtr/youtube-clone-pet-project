spring.application.name=notification-service
server.port=8001

# --- Настройки базы данных (PostgreSQL) ---
# Убедись, что имя базы совпадает с тем, что ты создал в Docker (notification_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/notification-service
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Spring Cloud Stream + Kafka ---
spring.cloud.function.definition=userRegistered

# Настройка входа (Inbound)
spring.cloud.stream.bindings.userRegistered-in-0.destination=user-registration-topic
spring.cloud.stream.bindings.userRegistered-in-0.group=notification-group

# ФИКС ОШИБКИ REPLICATION FACTOR (Добавь эти строки!)
spring.cloud.stream.kafka.binder.replication-factor=1
spring.cloud.stream.kafka.binder.auto-add-partitions=true
spring.cloud.stream.kafka.binder.auto-create-topics=true

# Адреса брокеров Кафки
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# --- Безопасность ---
spring.security.user.name=admin
spring.security.user.password=admin