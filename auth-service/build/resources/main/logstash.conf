input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "auth-service-logs-%{+YYYY.MM.dd}"
    # Если Elastic потребует пароль, раскомментируй строки ниже:
    # user => "elastic"
    # password => "elastic_password"
  }

  stdout { codec => rubydebug }
}